[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "battfeed"
version = "0.5.0"
description = "Turn live battery data sources into BDF feeds"
readme = "README.md"
authors = [{ name = "Simon Clark" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
keywords = ["battery", "bdf", "battery-data-format", "data-acquisition", "digibatt", "battfeed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/DigiBatt/battfeed"
Documentation = "https://digibatt.github.io/battfeed/"
Issues = "https://github.com/DigiBatt/battfeed/issues"

[project.optional-dependencies]
wmi = ["wmi"]
mc3000-ble = ["bleak>=0.21"]
mc3000-usb = ["pyusb>=1.2"]
bdf = ["batterydf"]
parquet = ["pyarrow>=14"]
dev = ["pytest", "ruff", "mypy"]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "pydata-sphinx-theme>=0.16",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
]

[project.scripts]
battfeed = "battfeed.cli:main"

# The built-in sources are registered through the same entry-point group that
# third-party packages use, so the plugin mechanism is exercised by battfeed itself.
[project.entry-points."battfeed.sources"]
simulator = "battfeed.sources.simulator:SimulatedCellSource"
csvtail = "battfeed.sources.csvtail:CsvTailSource"
dji = "battfeed.sources.dji:DjiFlightLogSource"
wmi = "battfeed.sources.wmi_battery:WmiBatterySource"
mc3000 = "battfeed.sources.mc3000:Mc3000Source"
android = "battfeed.sources.android:AndroidBatterySource"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
# Docs code blocks are teaching material (aligned comments, elided output);
# newer ruff releases format markdown code blocks by default. Keep the gate
# scoped to real source.
exclude = ["docs"]
target-version = "py310"

[tool.ruff.lint]
# Pinned to the ruleset this codebase was written against (the pre-0.16 ruff
# defaults) plus import sorting. Ruff's own defaults drift between versions;
# an unpinned selection turns the gate red without any code change.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional integrations without type stubs, imported lazily behind extras.
module = ["bdf", "bdf.*", "wmi", "bleak", "bleak.*", "usb", "usb.*"]
ignore_missing_imports = true
